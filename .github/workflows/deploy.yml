name: AWS Deployment Orchestration

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

env:
  AWS_REGION: eu-north-1
  PROJECT_NAME: prepsphere

jobs:
  build-backend:
    name: Build & Push Backend Services to ECR
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth-service, billing-service, interview-service, resume-service, roadmap-service]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.service == 'gateway' && 'gateway' || format('services/{0}', matrix.service) }}/Dockerfile
          load: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        run: docker push ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}

  infrastructure-app:
    name: Provision App Infrastructure (ECS, ALB, S3)
    needs: build-backend
    runs-on: ubuntu-latest
    outputs:
      alb_url: ${{ steps.tf-outputs.outputs.alb_dns }}
      s3_bucket: ${{ steps.tf-outputs.outputs.s3_bucket }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          soft_fail: true # Temporary soft fail so we don't break existing deployments due to missing KMS keys on S3 etc.
          framework: terraform

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_image_tag: ${{ github.event.workflow_run.head_sha }}
          TF_VAR_mongodb_url: ${{ secrets.MONGODB_URL }}
          TF_VAR_postgres_url: ${{ secrets.POSTGRES_URL }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_razorpay_key_id: ${{ secrets.RAZORPAY_KEY_ID }}
          TF_VAR_razorpay_key_secret: ${{ secrets.RAZORPAY_KEY_SECRET }}
          TF_VAR_razorpay_webhook_secret: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply tfplan

      - name: Extract Terraform Outputs
        id: tf-outputs
        working-directory: ./terraform
        run: |
          echo "alb_dns=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT

      - name: Wait for ECS Stability
        run: |
          set -e
          aws ecs wait services-stable \
            --cluster ${{ steps.tf-outputs.outputs.ecs_cluster }} \
            --services prepsphere-gateway-production prepsphere-auth-service-production prepsphere-billing-service-production prepsphere-interview-service-production prepsphere-resume-service-production prepsphere-roadmap-service-production

      - name: API Smoke Test
        run: |
          set -e
          curl --fail --retry 5 --retry-delay 5 http://${{ steps.tf-outputs.outputs.alb_dns }}/

  build-frontend:
    name: Build & Deploy Frontend to S3
    needs: infrastructure-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: http://${{ needs.infrastructure-app.outputs.alb_url }}
        run: npm run build

      - name: Deploy to S3
        working-directory: ./frontend
        run: aws s3 sync dist/ s3://${{ needs.infrastructure-app.outputs.s3_bucket }} --delete
