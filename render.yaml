version: "1"

services:
  - type: web
    name: prepsphere-gateway
    env: node
    rootDir: backend/gateway
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  - type: web
    name: prepsphere-auth
    env: node
    rootDir: backend/services/auth-service
