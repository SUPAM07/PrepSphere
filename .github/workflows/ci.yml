name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend CI
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci
      - name: Audit Dependencies
        working-directory: ./backend
        run: npm audit --audit-level=high || true # Temporarily allow failure so it doesn't immediately block if high vulns exist, but report them
      - name: Lint
        working-directory: ./backend
        run: npm run lint --if-present
      - name: Typecheck
        working-directory: ./backend
        run: npm run typecheck --if-present || npx tsc --noEmit --skipLibCheck
      - name: Test
        working-directory: ./backend
        run: npm test --if-present || echo "No tests configured"
      - name: Build
        working-directory: ./backend
        run: npm run build --if-present

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Audit Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high || true
      - name: Lint
        working-directory: ./frontend
        run: npm run lint --if-present
      - name: Test
        working-directory: ./frontend
        run: npm test --if-present || echo "No tests configured"
      - name: Build
        working-directory: ./frontend
        run: npm run build --if-present
