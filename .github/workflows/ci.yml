name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci
      - name: Lint
        working-directory: ./backend
        run: npm run lint --if-present
      - name: Typecheck
        working-directory: ./backend
        run: npm run typecheck --if-present || npx tsc --noEmit --skipLibCheck
      - name: Test
        working-directory: ./backend
        run: npm test --if-present || echo "No tests configured"
      - name: Build
        working-directory: ./backend
        run: npm run build --if-present

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint
        working-directory: ./frontend
        run: npm run lint --if-present
      - name: Test
        working-directory: ./frontend
        run: npm test --if-present || echo "No tests configured"
      - name: Build
        working-directory: ./frontend
        run: npm run build --if-present
