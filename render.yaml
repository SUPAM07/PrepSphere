version: "1"

envVarGroups:
  - name: prepsphere-secrets
    envVars:
      - key: POSTGRES_URL
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

services:
  - type: web
    name: prepsphere-gateway
    env: node
    rootDir: backend/gateway
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: "production"
      - key: AUTH_SERVICE_URL
        value: "http://prepsphere-auth:10000"
      - key: BILLING_SERVICE_URL
        value: "http://prepsphere-billing:10000"
      - key: INTERVIEW_SERVICE_URL
        value: "http://prepsphere-interview:10000"
      - key: RESUME_SERVICE_URL
        value: "http://prepsphere-resume:10000"
      - key: ROADMAP_SERVICE_URL
        value: "http://prepsphere-roadmap:10000"

  - type: web
    name: prepsphere-auth
    env: node
    rootDir: backend/services/auth-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    fromGroup: prepsphere-secrets
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: "production"

  - type: web
    name: prepsphere-billing
    env: node
    rootDir: backend/services/billing-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    fromGroup: prepsphere-secrets
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: "production"

  - type: web
    name: prepsphere-interview
    env: node
    rootDir: backend/services/interview-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    fromGroup: prepsphere-secrets
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: "production"

  - type: web
    name: prepsphere-resume
    env: node
    rootDir: backend/services/resume-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    fromGroup: prepsphere-secrets
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: "production"

  - type: web
    name: prepsphere-roadmap
    env: node
    rootDir: backend/services/roadmap-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    fromGroup: prepsphere-secrets
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: "production"
