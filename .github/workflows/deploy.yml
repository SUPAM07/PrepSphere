name: Deploy PrepSphere to AWS

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-north-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------
      # Build, Tag and Push Backend to ECR
      # ----------------------------------------------------
      - name: Build and Push Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/gateway/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/auth-service/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Billing Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/billing-service/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/billing-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Interview Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/interview-service/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/interview-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Resume Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/resume-service/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/resume-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Roadmap Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/roadmap-service/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/roadmap-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------
      # Provision Infrastructure with Terraform
      # ----------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
        env:
          TF_VAR_mongodb_url: ${{ secrets.MONGODB_URL }}
          TF_VAR_postgres_url: ${{ secrets.POSTGRES_URL }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_razorpay_key_id: ${{ secrets.RAZORPAY_KEY_ID }}
          TF_VAR_razorpay_key_secret: ${{ secrets.RAZORPAY_KEY_SECRET }}
          TF_VAR_razorpay_webhook_secret: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}

      # ----------------------------------------------------
      # Build and Deploy Frontend to S3 (Bucket exists now!)
      # ----------------------------------------------------
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_BASE_URL: http://${{ secrets.ALB_DNS_NAME }}

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist/ s3://prepsphere-frontend-production --delete



      # ----------------------------------------------------
      # Force Deploy ECS Services to Pick Up New Images
      # ----------------------------------------------------
      - name: Deploy to ECS Fargate
        run: |
          aws ecs update-service --cluster prepsphere-cluster-production --service prepsphere-auth-service-production --force-new-deployment || true
          aws ecs update-service --cluster prepsphere-cluster-production --service prepsphere-billing-service-production --force-new-deployment || true
          aws ecs update-service --cluster prepsphere-cluster-production --service prepsphere-interview-service-production --force-new-deployment || true
          aws ecs update-service --cluster prepsphere-cluster-production --service prepsphere-resume-service-production --force-new-deployment || true
          aws ecs update-service --cluster prepsphere-cluster-production --service prepsphere-roadmap-service-production --force-new-deployment || true
          aws ecs update-service --cluster prepsphere-cluster-production --service prepsphere-gateway-production --force-new-deployment || true
